name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/didactica tests/steprl tests/unirl -m "not isabelle"
      - run: python -m didactica.biseccion --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs
      - run: python -m steprl verify
